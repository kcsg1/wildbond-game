# 버전 핀. docs/architecture.md §1 · CLAUDE.md "코딩 규칙" 참고.
# 이 파일은 오프라인 환경에서 작성되었다. Gradle 이 "Could not find <coord>" 로 실패하면
# Maven Central 의 최신 패치 버전으로 올리고, 바꾼 버전을 plan.md 에 기록한다.
[versions]
junit = "5.13.4"
assertj = "3.27.3"
archunit = "1.4.1"
spotless = "7.2.1"
googleJavaFormat = "1.28.0"
artemisOdb = "2.3.0"
zstdJni = "1.5.7-16"
gdx = "1.13.5"
# gdx-backend-lwjgl3 1.13.5 의 POM 이 요구하는 LWJGL3 버전 그대로 (win_amd64 만 남기고 나머지 플랫폼
# 네이티브는 제외한다, §5.6). 버전을 올릴 때는 gdx-backend-lwjgl3 새 버전의 POM 을 먼저 확인할 것.
lwjgl = "3.3.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
artemis-odb = { module = "net.onedaybeard.artemis:artemis-odb", version.ref = "artemisOdb" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
gdx-core = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
