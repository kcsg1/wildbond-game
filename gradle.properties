# google-java-format(spotless)이 JDK 16+ 에서 javac 내부 API 에 접근해야 한다.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

org.gradle.parallel=true
org.gradle.caching=true

# 대상 Java 버전 (D-15 = 25). 다른 JDK 로 검증할 때만 -Pwildbond.javaVersion=NN 으로 덮어쓴다.
wildbond.javaVersion=25
